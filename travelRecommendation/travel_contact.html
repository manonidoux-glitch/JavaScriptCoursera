<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contact Us | TravelBloom</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:white;min-height:100vh;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),url('https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=1600&q=85') center/cover fixed}nav{display:flex;align-items:center;flex-wrap:wrap;gap:25px;background:#102f3b;padding:16px 5%}nav h2{margin:0 25px 0 0}nav a{color:white;text-decoration:none}main{display:flex;align-items:center;justify-content:space-around;flex-wrap:wrap;gap:35px;padding:55px 8%;min-height:75vh}h1{font-size:clamp(32px,5vw,55px)}.contact-form{background:rgba(0,0,0,.5);padding:28px;border-radius:10px;width:min(400px,100%)}label{display:block;margin:12px 0 7px}input,textarea{width:100%;padding:12px;background:rgba(255,255,255,.12);color:white;border:1px solid #fff;border-radius:5px}input::placeholder,textarea::placeholder{color:#ddd}textarea{min-height:110px;resize:vertical}button{width:100%;margin-top:18px;background:#008b83;color:white;border:0;border-radius:5px;padding:12px;cursor:pointer}
</style></head>
<body><nav><h2>TravelBloom</h2><a href="travelRecommendation.html">Home</a><a href="travel_about.html">About Us</a><a href="travel_contact.html">Contact Us</a></nav>
<main><section><h1>CONTACT US</h1><p>Get in touch with our team!</p></section><section class="contact-form"><form id="contactForm"><label for="name">Name</label><input id="name" name="name" type="text" placeholder="Enter your name" required><label for="email">Email</label><input id="email" name="email" type="email" placeholder="Enter your email" required><label for="message">Message</label><textarea id="message" name="message" placeholder="Enter your message" required></textarea><button type="submit">Submit</button></form><p id="formStatus" role="status"></p></section></main>
<script>document.getElementById('contactForm').addEventListener('submit',function(event){event.preventDefault();document.getElementById('formStatus').textContent='Thank you for contacting TravelBloom! (Demo only: no message was sent.)';this.reset();});</script>
</body></html>
